name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build the wheel and the sdist
        run: uv build
      - name: Check that the tag matches the package version
        run: |
          if [ ! -f "dist/parse_broken_json-${GITHUB_REF_NAME#v}-py3-none-any.whl" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the built version:" dist/*
            exit 1
          fi
      # Through the CLI, so the installed package is tested and not the checkout.
      - name: Smoke-test the wheel and the sdist
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            out=$(echo '{"a": [1, 2' | uv run --isolated --no-project --with "$dist" parse-broken-json --compact)
            if [ "$out" != '{"a": [1, 2]}' ]; then
              echo "::error::$dist printed: $out"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # A separate job, so only this one can request the publishing token. It waits
  # for approval in the pypi environment.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/parse-broken-json/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish to PyPI
        run: uv publish
