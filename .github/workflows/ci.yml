name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the project and the dev group
        run: uv sync
      - name: Lint
        run: uv run ruff check parse_broken_json tests
      - name: Format
        run: uv run ruff format --check parse_broken_json tests
      - name: Type-check with mypy
        run: uv run mypy
      - name: Type-check with ty
        run: uv run ty check
      - name: Test
        run: uv run pytest --cov=parse_broken_json --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build the wheel and the sdist
        run: uv build
