[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[options]
package_dir = "parse_broken_json"
packages = ["parse_broken_json"]

[project]
name = "parse_broken_json"
version = "0.3"
authors = [
    {name = "Carlos A. Planchón", email = "carlosandresplanchonprestes@gmail.com"}
]
description = "Python library to help parsing broken and invalid JSON."
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]


license = "MIT"
license-files = ["LICENSE"]

keywords = ["parsing", "broken", "json", "invalid"]
readme = "README.md"
dependencies=[
    "ijson",
]

[project.urls]
Repository = "https://github.com/carlosplanchon/parse_broken_json.git"
